# spark-dashboard — containerized deployment.
#
# Defaults to host networking so the dashboard can discover vLLM/engine
# processes and containers running on the host network. For an isolated bridge
# setup, layer the override:
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.bridge.yml up -d
#
# Configure via a .env file (see .env.docker.example). By default this pulls the
# published image; run `docker compose build` to build from source instead.
#
# Run from the repo root with `-f deploy/docker/docker-compose.yml` (or
# `cd deploy/docker`). The build context is the repo root (`../..`) because the
# Dockerfile copies src/, frontend/, Cargo.*, and deploy/host/.
services:
  spark-dashboard:
    image: ${SPARK_DASHBOARD_IMAGE:-ghcr.io/niklasfrick/spark-dashboard:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-}
    container_name: spark-dashboard

    # Host network: required to reach engines bound to the host (e.g. vLLM via
    # sparkrun) and for process-based discovery. See the bridge override to opt
    # out at the cost of host-network engine discovery.
    network_mode: host

    # Share the host PID namespace for process-based engine discovery.
    pid: host

    # GPU passthrough via the NVIDIA Container Toolkit. No device-file mounts
    # needed — metrics come from NVML.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Read-only Docker socket so the dashboard can list vLLM containers. The
    # added group must match the host's docker GID — set DOCKER_GID in .env
    # (find it with: getent group docker | cut -d: -f3). Defaults to 999.

    # Saved dashboards, on a named volume so they outlive the container. Mount
    # point and SPARK_DASHBOARD_STATE_DIR below read the same variable so they
    # cannot drift apart. See docker.md, "Saved dashboards", for why the image
    # has to pre-create the directory.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - spark-dashboard-state:${SPARK_DASHBOARD_STATE_DIR:-/var/lib/spark-dashboard}
    group_add:
      - "${DOCKER_GID:-999}"

    environment:
      - SPARK_DASHBOARD_PORT=${SPARK_DASHBOARD_PORT:-3000}
      - SPARK_DASHBOARD_BIND=${SPARK_DASHBOARD_BIND:-0.0.0.0}
      - SPARK_DASHBOARD_POLL_INTERVAL=${SPARK_DASHBOARD_POLL_INTERVAL:-1000}
      - SPARK_DASHBOARD_STATE_DIR=${SPARK_DASHBOARD_STATE_DIR:-/var/lib/spark-dashboard}
      - SPARK_DASHBOARD_GPU_INDEX
      - SPARK_DASHBOARD_SIMULATE_GPUS=${SPARK_DASHBOARD_SIMULATE_GPUS:-0}
      - SPARK_DASHBOARD_PROVIDER_API_KEY=${SPARK_DASHBOARD_PROVIDER_API_KEY:-}
      # Opt-in log viewer (/ws/logs). Off by default: the endpoint is
      # unauthenticated and engine logs can contain prompts — see the README's
      # "Log viewer" section before enabling.
      - SPARK_DASHBOARD_ENABLE_LOG_VIEWER=${SPARK_DASHBOARD_ENABLE_LOG_VIEWER:-0}
      - RUST_LOG=${RUST_LOG:-info}

    restart: unless-stopped

volumes:
  # Removed only by an explicit `docker compose down -v` — a plain `down` keeps
  # the saved dashboards. `name:` pins the volume as-written: without it Compose
  # prefixes the project name (`docker_spark-dashboard-state`, after this file's
  # directory), which every documented `docker volume` command would then miss.
  spark-dashboard-state:
    name: spark-dashboard-state
